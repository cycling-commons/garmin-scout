name: Feature request
description: Suggest an idea for Scout
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that Scout doesn't support today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: checkboxes
    id: device-dumb
    attributes:
      label: Quick gut-check
      description: >
        See CONTRIBUTING.md's "keep the device dumb" principle — new smarts
        usually belong in the parser, not on-device, so they can be fixed and
        re-applied to rides already recorded.
      options:
        - label: I've considered whether this could live in the parser instead of on the device
