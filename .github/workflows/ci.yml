name: CI

on:
  push:
  pull_request:

jobs:
  parser-tests:
    name: Parser tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run parser + E2E tests
        run: node Garmin/tools/test-fit-parser.mjs Garmin/tools/fit-viewer.html

  android-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Gradle unit tests
        working-directory: Android
        run: |
          npm install --prefix tools --no-fund --no-audit
          ./gradlew :domain:test :fit:test :app:test --no-daemon
